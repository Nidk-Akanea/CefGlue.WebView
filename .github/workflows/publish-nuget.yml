name: Publish NuGet to GitHub Packages

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'           # déclenche aussi sur git tag v1.2.3
  workflow_dispatch:   # déclenchement manuel depuis l'onglet Actions

env:
  PACKAGE_VERSION: 3.120.11-avalonia12
  PROJECT: WebViewControl.Avalonia/WebViewControl.Avalonia.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # nécessaire pour pousser sur GitHub Packages
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Setup NuGet auth for restore (fork CefGlue)
        # Le Nuget.config du repo référence github-Nidk-Akanea avec %GITHUB_TOKEN%
        # On l'expose ici pour que la restore puisse récupérer le fork CefGlue.Avalonia.
        run: echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: |
          dotnet build ${{ env.PROJECT }} \
            -c Release \
            /p:Version="${{ env.PACKAGE_VERSION }}" \
            /p:GeneratePackageOnBuild=false \
            --no-restore

      - name: Pack
        run: |
          dotnet pack ${{ env.PROJECT }} \
            -c Release \
            /p:Version="${{ env.PACKAGE_VERSION }}" \
            --no-restore \
            --no-build \
            --output ./nupkg

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Upload nupkg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: ./nupkg/*.nupkg
